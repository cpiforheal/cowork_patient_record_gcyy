      # ---------------- 拼装与覆盖度校验 ----------------
      - id: merge_validate
        type: custom
        position: {x: 1280, y: 470}
        data:
          type: code
          title: 拼装与覆盖度校验
          desc: 合并四路输出，校验段落编号覆盖 1..N
          code_language: python3
          code: |
            def main(slice_a: str, slice_b: str, slice_c: str, slice_d: str, total_n: int) -> dict:
                import json
                import re

                def parse_slice(raw):
                    s = (raw or "").strip()
                    if not s:
                        return []
                    s = re.sub(r"^```(?:json)?\s*|```\s*$", "", s, flags=re.M).strip()
                    start = s.find("{")
                    end = s.rfind("}")
                    if start == -1 or end <= start:
                        return []
                    try:
                        obj = json.loads(s[start:end + 1])
                    except Exception:
                        return []
                    items = obj.get("items") if isinstance(obj, dict) else None
                    pairs = []
                    if isinstance(items, list):
                        for it in items:
                            if not isinstance(it, dict):
                                continue
                            try:
                                n = int(str(it.get("n", "")).strip())
                            except Exception:
                                continue
                            pairs.append((n, str(it.get("text", ""))))
                    return pairs

                by_n = {}
                for chunk in (slice_a, slice_b, slice_c, slice_d):
                    for n, t in parse_slice(chunk):
                        by_n[n] = t

                if total_n <= 0:
                    return {
                        "paragraphs_json": json.dumps({"paragraphs": []}, ensure_ascii=False, separators=(",", ":")),
                        "total_n": 0, "covered_n": 0, "missing_n": "",
                        "error_code": "EMPTY_REFERENCE",
                    }

                missing = [n for n in range(1, total_n + 1) if n not in by_n]
                covered = total_n - len(missing)
                paragraphs = [{"n": n, "text": by_n.get(n, "")} for n in range(1, total_n + 1)]

                if covered < max(1, int(total_n * 0.5)):
                    error_code = "PARAGRAPH_COVERAGE_INCOMPLETE"
                elif missing:
                    error_code = "PARTIAL_COVERAGE"
                else:
                    error_code = "OK"

                return {
                    "paragraphs_json": json.dumps({"paragraphs": paragraphs}, ensure_ascii=False, separators=(",", ":")),
                    "total_n": total_n,
                    "covered_n": covered,
                    "missing_n": ",".join(str(n) for n in missing)[:900],
                    "error_code": error_code,
                }
          variables:
            - {variable: slice_a, value_selector: ['rewrite_a', 'text']}
            - {variable: slice_b, value_selector: ['rewrite_b', 'text']}
            - {variable: slice_c, value_selector: ['rewrite_c', 'text']}
            - {variable: slice_d, value_selector: ['rewrite_d', 'text']}
            - {variable: total_n, value_selector: ['prepare', 'total_n']}
          outputs:
            paragraphs_json: {type: string, children: null}
            total_n: {type: number, children: null}
            covered_n: {type: number, children: null}
            missing_n: {type: string, children: null}
            error_code: {type: string, children: null}

      # ---------------- 结束输出 ----------------
      - id: end
        type: custom
        position: {x: 1560, y: 470}
        data:
          type: end
          title: 结束
          desc: paragraphs_json 为后端渲染 DOCX 的唯一内容来源
          outputs:
            - {variable: paragraphs_json, value_selector: ['merge_validate', 'paragraphs_json']}
            - {variable: total_n, value_selector: ['merge_validate', 'total_n']}
            - {variable: covered_n, value_selector: ['merge_validate', 'covered_n']}
            - {variable: missing_n, value_selector: ['merge_validate', 'missing_n']}
            - {variable: error_code, value_selector: ['merge_validate', 'error_code']}

# =====================================================================
# 【输出 error_code 说明】
#   OK                            全部 1..N 段落覆盖完整，paragraphs_json 可直接使用
#   PARTIAL_COVERAGE              少量段落缺失（≤5% 容忍线与 50% 硬线之间），
#                                 缺失编号见 missing_n；后端可沿用范本原文占位
#   PARAGRAPH_COVERAGE_INCOMPLETE 覆盖率低于 50%，应整任务失败并重试
#   EMPTY_REFERENCE               参考范本为空，输入错误
# 【后端对接占位（阶段 2）】POST {实例地址}/v1/workflows/run
#   inputs = 上述七个输入变量；response_mode 先 stream（分片节点完成时
#   产生 node_finished 事件，可映射为系统内逐片进度），解析 end 输出。
# =====================================================================
