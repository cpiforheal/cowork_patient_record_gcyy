<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>检验报告查询</title>
    <style>
      :root {
        --primary: #0891b2;
        --primary-deep: #0e7490;
        --mint: #22d3ee;
        --accent: #fb7185;
        --accent-warm: #fdba74;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --violet: #8b5cf6;
        --bg: #f4fafa;
        --surface: #ffffff;
        --ink: #0f2a33;
        --muted: #5b7480;
        --line: #e2eef0;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%;
        background:
          radial-gradient(900px 420px at 85% -10%, rgba(34, 211, 238, 0.16), transparent 60%),
          radial-gradient(700px 380px at -10% 20%, rgba(251, 113, 133, 0.10), transparent 60%),
          var(--bg);
      }
      body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); user-select: none; -webkit-user-select: none; }
      .page {
        max-width: 640px; margin: 0 auto; min-height: 100vh; background: var(--surface);
        padding-bottom: 28px; position: relative; overflow: hidden;
        box-shadow: 0 0 0 1px rgba(15, 42, 51, 0.03), 0 24px 60px rgba(8, 145, 178, 0.08);
      }
      .brand {
        position: relative; display: flex; align-items: center; gap: 13px;
        padding: 22px 18px 18px; color: #fff;
        background: linear-gradient(135deg, #0891b2 0%, #22d3ee 100%);
        overflow: hidden;
      }
      .brand::before,
      .brand::after {
        content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.16);
        pointer-events: none; animation: float 9s ease-in-out infinite;
      }
      .brand::before { width: 150px; height: 150px; right: -40px; top: -70px; }
      .brand::after { width: 90px; height: 90px; right: 70px; bottom: -55px; animation-delay: -4s; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      .brand img {
        width: 54px; height: 54px; border-radius: 14px; background: #fff; object-fit: contain;
        padding: 4px; flex: 0 0 auto; box-shadow: 0 6px 18px rgba(0, 31, 41, 0.18); position: relative; z-index: 1;
      }
      .brand-text { position: relative; z-index: 1; }
      .brand h1 { margin: 0; font-size: 19px; line-height: 1.3; letter-spacing: 0.4px; }
      .brand p { margin: 3px 0 0; font-size: 12px; opacity: 0.9; }
      .notice { display: flex; align-items: flex-start; gap: 8px; padding: 9px 16px; font-size: 12px; }
      .notice svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 1px; }
      .notice.sensitive { background: #fff7ed; color: #9a4a06; border-bottom: 1px solid #fbe3c4; }
      .notice.insecure { background: #fff1f2; color: #a11d33; border-bottom: 1px solid #fcd3d9; }
      .content { padding: 20px 16px 0; }
      .hero { margin-bottom: 16px; animation: rise 0.3s var(--ease) both; }
      .hero h2 { margin: 0; font-size: 23px; line-height: 1.3; letter-spacing: 0.2px; }
      .hero h2 em { font-style: normal; color: var(--primary); }
      .hero p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
      .card {
        position: relative; background: var(--surface); border: 1px solid var(--line);
        border-radius: 18px; padding: 18px 16px;
        box-shadow: 0 12px 30px rgba(8, 145, 178, 0.10);
      }
      .login-card { animation: rise 0.32s var(--ease) both; animation-delay: 60ms; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 999px; background: #eef7f8; margin-bottom: 16px; }
      .tab {
        height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--muted);
        font-size: 14px; font-weight: 500; cursor: pointer;
        transition: background 0.2s var(--ease), color 0.2s var(--ease), box-shadow 0.2s var(--ease);
      }
      .tab.is-active { background: #fff; color: var(--primary-deep); box-shadow: 0 3px 10px rgba(8, 145, 178, 0.16); }
      .field { margin-bottom: 14px; }
      .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
      .field input {
        width: 100%; height: 52px; padding: 0 15px; font-size: 17px; color: var(--ink);
        border: 1.5px solid var(--line); border-radius: 13px; background: #fbfefe; outline: none;
        transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease), transform 0.18s var(--ease), background 0.18s var(--ease);
      }
      .field input::placeholder { color: #9db3ba; }
      .field input:focus {
        border-color: var(--primary); background: #fff; transform: translateY(-1px);
        box-shadow: 0 0 0 4px rgba(8, 145, 178, 0.14);
      }
      .submit {
        position: relative; width: 100%; height: 52px; border: 0; border-radius: 13px;
        background: linear-gradient(135deg, #fb7185 0%, #fdba74 100%); color: #fff;
        font-size: 17px; font-weight: 600; letter-spacing: 0.5px; cursor: pointer;
        box-shadow: 0 10px 22px rgba(251, 113, 133, 0.30);
        transition: transform 0.12s var(--ease), box-shadow 0.18s var(--ease), filter 0.18s var(--ease);
      }
      .submit:active { transform: scale(0.97); box-shadow: 0 5px 12px rgba(251, 113, 133, 0.26); }
      .submit:disabled { filter: saturate(0.8); opacity: 0.75; cursor: default; }
      .spinner {
        display: inline-block; width: 16px; height: 16px; margin-right: 8px; vertical-align: -2px;
        border: 2px solid rgba(255, 255, 255, 0.5); border-top-color: #fff; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .form-error {
        margin: 10px 0 0; min-height: 20px; color: var(--danger); font-size: 13px;
        opacity: 0; transform: translateY(-2px); transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
      }
      .form-error.is-visible { opacity: 1; transform: none; }
      .welcome { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; animation: rise 0.3s var(--ease) both; }
      .welcome strong { font-size: 19px; }
      .switch { border: 0; background: none; color: var(--primary); font-size: 13px; cursor: pointer; padding: 8px; }
      .critical-banner {
        display: flex; align-items: center; gap: 9px; margin-bottom: 14px; padding: 12px 14px;
        border-radius: 14px; border: 1px solid #fbd5da; color: #b91c1c;
        background: linear-gradient(135deg, #fff1f2, #fff7ed); font-size: 14px; font-weight: 600;
        animation: rise 0.3s var(--ease) both;
      }
      .critical-banner i {
        width: 9px; height: 9px; border-radius: 50%; background: var(--danger); flex: 0 0 auto;
        animation: breathe 2s ease-in-out infinite;
      }
      @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.3); opacity: 1; } }
      .visit {
        border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden;
        background: var(--surface); box-shadow: 0 8px 22px rgba(8, 145, 178, 0.06);
        animation: rise 0.32s var(--ease) both;
      }
      .visit-head {
        width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px;
        border: 0; background: none; text-align: left; cursor: pointer;
      }
      .date-badge {
        width: 46px; height: 46px; border-radius: 13px; display: grid; place-content: center; text-align: center;
        background: linear-gradient(135deg, #e0f7fa, #ecfeff); color: var(--primary-deep); flex: 0 0 auto;
      }
      .date-badge b { font-size: 17px; line-height: 1; }
      .date-badge small { font-size: 10px; color: var(--muted); margin-top: 2px; }
      .visit-info { flex: 1 1 auto; min-width: 0; }
      .visit-info strong { display: block; font-size: 15px; }
      .visit-info small { color: var(--muted); font-size: 12px; }
      .chevron { color: var(--muted); font-size: 18px; transition: transform 0.22s var(--ease); }
      .visit.open .chevron { transform: rotate(90deg); }
      .visit-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.24s var(--ease); }
      .visit.open .visit-body { grid-template-rows: 1fr; }
      .visit-body-inner { overflow: hidden; padding: 0 12px; }
      .report { border-top: 1px dashed var(--line); }
      .report:first-child { border-top: 0; }
      .report-head {
        position: relative; width: 100%; display: flex; align-items: flex-start; justify-content: space-between;
        gap: 10px; padding: 12px 4px 12px 14px; border: 0; background: none; text-align: left; cursor: pointer;
      }
      .report-head::before {
        content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 4px;
        background: var(--type-color, var(--primary));
      }
      .report.t1 { --type-color: #fb7185; }
      .report.t2 { --type-color: #0891b2; }
      .report.t3 { --type-color: #f59e0b; }
      .report.t4 { --type-color: #8b5cf6; }
      .report.t5 { --type-color: #22d3ee; }
      .report-title { display: block; font-size: 15px; font-weight: 600; }
      .report-sub { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
      .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; padding-top: 2px; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; white-space: nowrap; font-weight: 500; }
      .badge.warn { background: #fef3c7; color: #92400e; }
      .badge.danger { background: #fee2e2; color: #b91c1c; animation: breathe 2s ease-in-out infinite; }
      .badge.info { background: #ecfeff; color: #0e7490; }
      .report-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.24s var(--ease); }
      .report.open .report-body { grid-template-rows: 1fr; }
      .report-body-inner { overflow: hidden; padding: 0 4px 10px; }
      .metric {
        display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; font-size: 15px;
        animation: fadeIn 0.24s var(--ease) both;
      }
      .metric:first-child { border-top: 0; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      .metric .name { font-weight: 500; word-break: break-word; }
      .metric .value { font-weight: 700; font-size: 17px; white-space: nowrap; }
      .metric .value em { font-style: normal; font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
      .metric .ref { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
      .metric.abnormal .value, .metric.abnormal .ref { color: #b45309; }
      .metric.critical .value, .metric.critical .ref { color: var(--danger); }
      .arrow { margin-left: 2px; font-size: 13px; }
      .skeleton { padding: 6px 2px 4px; }
      .skeleton-row {
        height: 18px; margin: 10px 0; border-radius: 6px;
        background: linear-gradient(90deg, #eef4f5 25%, #f8fbfb 37%, #eef4f5 63%);
        background-size: 400% 100%; animation: shimmer 1.2s ease infinite;
      }
      .skeleton-row:nth-child(2) { width: 82%; }
      .skeleton-row:nth-child(3) { width: 64%; }
      @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
      .empty-state { text-align: center; padding: 34px 18px; color: var(--muted); }
      .empty-state svg { width: 92px; height: 92px; margin-bottom: 10px; }
      .empty-state strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
      .empty-state p { margin: 0; font-size: 13px; }
      .footer { padding: 10px 18px 24px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.7; }
      .watermark { position: fixed; inset: 0; pointer-events: none; z-index: 9; overflow: hidden; opacity: 0.05; }
      .watermark span { position: absolute; transform: rotate(-28deg); white-space: nowrap; font-size: 15px; color: #0b3d33; }
      @media (max-width: 380px) {
        .brand h1 { font-size: 17px; }
        .hero h2 { font-size: 20px; }
        .metric { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); font-size: 14px; }
        .metric .value { font-size: 16px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
      }
      @media print { body { display: none !important; } }
    </style>
  </head>

          <p>检验报告查询 · 患者本人查阅</p>
        </div>
      </header>
      <div class="notice sensitive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 9v4m0 4h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>本页含敏感医疗信息，请勿截图或转发</span>
      </div>
      <div id="insecure" class="notice insecure" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 8v5m0 3h.01M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>当前为非加密连接，请勿在公共网络查看</span>
      </div>
      <main id="app" class="content"></main>
      <footer class="footer">
        <div>检验结果仅供参考，请以医生解释为准。</div>
        <div>如需帮助，请联系检验科或您的接诊医生。</div>
      </footer>
    </div>
    <div id="watermark" class="watermark" aria-hidden="true"></div>

    <script>
      (function () {
        var app = document.getElementById("app");
        var watermark = document.getElementById("watermark");
        if (location.protocol !== "https:") document.getElementById("insecure").hidden = false;

        function esc(value) {
          return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
          });
        }

        function api(path, options) {
          return fetch(path, Object.assign({ headers: { Accept: "application/json" } }, options || {}))
            .then(function (response) {
              return response.text().then(function (text) {
                var payload = null;
                try { payload = JSON.parse(text); } catch (error) { payload = null; }
                return { status: response.status, payload: payload };
              });
            });
        }

        function messageOf(result, fallback) {
          return (result.payload && result.payload.msg) || fallback;
        }

        function renderWatermark(name) {
          var stamp = new Date();
          var pad = function (n) { return String(n).padStart(2, "0"); };
          var time = (stamp.getMonth() + 1) + "-" + pad(stamp.getDate()) + " " + pad(stamp.getHours()) + ":" + pad(stamp.getMinutes());
          var text = (name || "患者") + " · " + time + " · 仅供本人查阅　";
          var html = "";
          for (var row = -2; row < 26; row++) {
            for (var col = -2; col < 6; col++) {
              html += '<span style="top:' + row * 96 + "px;left:" + col * 280 + 'px">' + esc(text) + "</span>";
            }
          }
          watermark.innerHTML = html;
        }

        function clearWatermark() { watermark.innerHTML = ""; }

        function renderLogin(message) {
          clearWatermark();
          app.innerHTML =
            '<section class="hero"><h2>随时查看<em>您的检验报告</em></h2>' +
            '<p>验证身份后，查看近 6 个月在本院完成的检验结果。</p></section>' +
            '<section class="card login-card">' +
              '<div class="tabs" role="tablist">' +
                '<button id="tab-id" class="tab is-active" type="button" role="tab" aria-selected="true">证件后六位</button>' +
                '<button id="tab-phone" class="tab" type="button" role="tab" aria-selected="false">手机号后四位</button>' +
              "</div>" +
              '<form id="login-form" autocomplete="off">' +
                '<div class="field"><label for="name">姓名</label>' +
                  '<input id="name" name="name" type="text" maxlength="30" enterkeyhint="next" placeholder="请输入登记时的姓名" />' +
                "</div>" +
                '<div class="field"><label id="digits-label" for="digits">证件号后六位</label>' +
                  '<input id="digits" name="digits" type="tel" maxlength="6" inputmode="numeric" enterkeyhint="done" placeholder="请输入证件号后六位" />' +
                "</div>" +
                '<button id="submit" class="submit" type="submit">查询报告</button>' +
                '<p id="form-error" class="form-error">' + esc(message || "") + "</p>" +
              "</form>" +
            "</section>";
          var mode = "ID";
          var form = document.getElementById("login-form");
          var digits = document.getElementById("digits");
          var label = document.getElementById("digits-label");
          var error = document.getElementById("form-error");
          var submit = document.getElementById("submit");
          var tabId = document.getElementById("tab-id");
          var tabPhone = document.getElementById("tab-phone");
          if (message) error.classList.add("is-visible");

          function setMode(next) {
            mode = next;
            var idActive = mode === "ID";
            tabId.classList.toggle("is-active", idActive);
            tabPhone.classList.toggle("is-active", !idActive);
            tabId.setAttribute("aria-selected", idActive ? "true" : "false");
            tabPhone.setAttribute("aria-selected", idActive ? "false" : "true");
            label.textContent = idActive ? "证件号后六位" : "手机号后四位";
            digits.maxLength = idActive ? 6 : 4;
            digits.placeholder = idActive ? "请输入证件号后六位" : "请输入手机号后四位";
            digits.value = "";
            error.classList.remove("is-visible");
            digits.focus();
          }
          tabId.addEventListener("click", function () { if (mode !== "ID") setMode("ID"); });
          tabPhone.addEventListener("click", function () { if (mode !== "PHONE") setMode("PHONE"); });

          form.addEventListener("submit", function (event) {
            event.preventDefault();
            var name = document.getElementById("name").value.trim();
            var value = digits.value.trim();
            if (!name) { error.textContent = "请填写姓名"; error.classList.add("is-visible"); return; }
            if (!value) {
              error.textContent = mode === "ID" ? "请填写证件号后六位" : "请填写手机号后四位";
              error.classList.add("is-visible");
              return;
            }
            submit.disabled = true;
            submit.innerHTML = '<span class="spinner"></span>查询中…';
            error.classList.remove("is-visible");
            api("/lab-api/lookup", {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({ name: name, mode: mode, lastDigits: value })
            }).then(function (result) {
              if (result.status === 200 && result.payload && result.payload.data) {
                renderList(result.payload.data);
                return;
              }
              error.textContent = messageOf(result, "查询失败，请稍后再试");
              error.classList.add("is-visible");
              submit.disabled = false;
              submit.textContent = "查询报告";
            }).catch(function () {
              error.textContent = "网络异常，请检查网络后重试";
              error.classList.add("is-visible");
              submit.disabled = false;
              submit.textContent = "查询报告";
            });
          });
        }

        function typeClass(name) {
          var text = String(name || "");
          if (/血常规|血细胞/.test(text)) return "t1";
          if (/肝|肾|生化|电解质|血糖|血脂/.test(text)) return "t2";
          if (/尿/.test(text)) return "t3";
          if (/凝血|D-二聚体/.test(text)) return "t4";
          return "t5";
        }

        function renderList(data) {
          var name = (data.patient && data.patient.name) || "";
          var groups = data.groups || [];
          if (!groups.length) { renderEmpty(name); return; }
          renderWatermark(name);
          var criticalTotal = 0;
          groups.forEach(function (group) {
            (group.reports || []).forEach(function (report) { criticalTotal += Number(report.criticalCount || 0); });
          });
          var html = '<div class="welcome"><span>您好，<strong>' + esc(name) + "</strong></span>" +
            '<button id="logout" class="switch" type="button">切换查询</button></div>';
          if (criticalTotal > 0) {
            html += '<div class="critical-banner"><i></i><span>您有 ' + criticalTotal + " 项危急值结果，请尽快联系医生。</span></div>";
          }
          html += '<div id="visits"></div>';
          app.innerHTML = html;
          var visits = document.getElementById("visits");
          groups.forEach(function (group, index) {
            var visit = document.createElement("section");
            visit.className = "visit";
            visit.style.animationDelay = (index * 40) + "ms";
            var parts = String(group.visitDate || "").split("-");
            var month = parts[1] || "";
            var day = parts[2] || "";
            var reportCount = (group.reports || []).length;
            visit.innerHTML =
              '<button class="visit-head" type="button" aria-expanded="false">' +
                '<span class="date-badge"><b>' + esc(day) + "</b><small>" + esc(month) + "月</small></span>" +
                '<span class="visit-info"><strong>' + esc(group.visitDate) + " 就诊</strong><small>" + reportCount + " 份报告</small></span>" +
                '<span class="chevron">›</span>' +
              "</button>" +
              '<div class="visit-body"><div class="visit-body-inner"></div></div>';
            var head = visit.querySelector(".visit-head");
            var inner = visit.querySelector(".visit-body-inner");
            head.addEventListener("click", function () {
              visit.classList.toggle("open");
              head.setAttribute("aria-expanded", visit.classList.contains("open") ? "true" : "false");
              if (visit.classList.contains("open") && !inner.dataset.rendered) {
                inner.dataset.rendered = "1";
                (group.reports || []).forEach(function (report) { inner.appendChild(reportCard(report)); });
              }
            });
            visits.appendChild(visit);
          });
          document.getElementById("logout").addEventListener("click", logout);
        }

        function reportCard(report) {
          var card = document.createElement("article");
          card.className = "report " + typeClass(report.templateName);
          var critical = Number(report.criticalCount || 0);
          var abnormal = Number(report.abnormalCount || 0);
          var badges = "";
          if (critical > 0) badges += '<span class="badge danger">危急 ' + critical + "</span>";
          if (abnormal > 0) badges += '<span class="badge warn">异常 ' + abnormal + "</span>";
          if (!badges) badges = '<span class="badge info">未见异常</span>';
          card.innerHTML =
            '<button class="report-head" type="button" aria-expanded="false">' +
              '<span><span class="report-title">' + esc(report.templateName || "检验报告") + "</span>" +
              '<span class="report-sub">' + esc(report.reportDate || "") + "</span></span>" +
              '<span class="badges">' + badges + "</span>" +
            "</button>" +
            '<div class="report-body"><div class="report-body-inner"></div></div>';
          var head = card.querySelector(".report-head");
          var inner = card.querySelector(".report-body-inner");
          head.addEventListener("click", function () {
            var open = card.classList.toggle("open");
            head.setAttribute("aria-expanded", open ? "true" : "false");
            if (!open || inner.dataset.loaded) return;
            inner.dataset.loaded = "1";
            inner.innerHTML = '<div class="skeleton"><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div>';
            api("/lab-api/reports/" + encodeURIComponent(report.reportId)).then(function (result) {
              if (result.status === 200 && result.payload && result.payload.data) {
                var metrics = result.payload.data.metrics || [];
                inner.innerHTML = metrics.length ? metrics.map(metricRow).join("") :
                  '<p style="color:#5b7480;font-size:13px;padding:8px 2px">暂无指标</p>';
                return;
              }
              inner.dataset.loaded = "";
              inner.innerHTML = '<p style="color:#b91c1c;font-size:13px;padding:8px 2px">' + esc(messageOf(result, "报告加载失败")) + "</p>";
            }).catch(function () {
              inner.dataset.loaded = "";
              inner.innerHTML = '<p style="color:#b91c1c;font-size:13px;padding:8px 2px">网络异常，请稍后重试</p>';
            });
          });
          return card;
        }

        function parseRange(reference) {
          var match = String(reference || "").match(/(-?\d+(?:\.\d+)?)\s*[-~至]\s*(-?\d+(?:\.\d+)?)/);
          return match ? { low: Number(match[1]), high: Number(match[2]) } : null;
        }

        function metricRow(metric) {
          var severity = metric.severity || "NORMAL";
          var critical = metric.critical === true || severity === "CRITICAL";
          var abnormal = !critical && severity === "ABNORMAL";
          var numeric = parseFloat(String(metric.value).replace(/[^\d.\-]/g, ""));
          var range = parseRange(metric.reference);
          var arrow = "";
          if (!critical && !abnormal && range && !isNaN(numeric)) {
            if (numeric < range.low) { abnormal = true; arrow = '<span class="arrow">↓</span>'; }
            else if (numeric > range.high) { abnormal = true; arrow = '<span class="arrow">↑</span>'; }
          }
          return (
            '<div class="metric ' + (critical ? "critical" : abnormal ? "abnormal" : "") + '">' +
              '<div class="name">' + esc(metric.name) + "</div>" +
              '<div class="value">' + esc(metric.value) +
                (metric.unit ? "<em>" + esc(metric.unit) + "</em>" : "") + arrow +
                (critical ? '<span class="badge danger" style="margin-left:6px">危急值</span>' : "") +
              "</div>" +
              '<div class="ref">' + (metric.reference ? "参考 " + esc(metric.reference) : "") + "</div>" +
            "</div>"
          );
        }

        function renderEmpty(name) {
          renderWatermark(name);
          app.innerHTML =
            '<div class="welcome"><span>您好，<strong>' + esc(name) + "</strong></span>" +
            '<button id="logout" class="switch" type="button">切换查询</button></div>' +
            '<section class="card empty-state">' +
              '<svg viewBox="0 0 96 96" fill="none" aria-hidden="true">' +
                '<rect x="22" y="14" width="52" height="68" rx="10" fill="#ECFEFF" stroke="#22D3EE" stroke-width="3"/>' +
                '<path d="M34 34h28M34 46h28M34 58h18" stroke="#0891B2" stroke-width="3" stroke-linecap="round"/>' +
                '<circle cx="70" cy="70" r="16" fill="#FFF1F2" stroke="#FB7185" stroke-width="3"/>' +
                '<path d="m82 82 8 8" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>' +
              "</svg>" +
              "<strong>暂无可查看报告</strong>" +
              "<p>报告完成后会自动同步，请以医院通知为准。</p>" +
            "</section>";
          document.getElementById("logout").addEventListener("click", logout);
        }

        function logout() {
          api("/lab-api/logout", { method: "POST" }).then(function () { renderLogin(""); });
        }

        api("/lab-api/reports").then(function (result) {
          if (result.status === 200 && result.payload && result.payload.data) {
            renderList(result.payload.data);
            return;
          }
          renderLogin("");
        }).catch(function () { renderLogin(""); });
      })();
    </script>
  </body>
</html>
