<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>检验报告查询</title>
    <style>
      :root {
        --brand: #0b6e5b;
        --brand-soft: #e7f3ef;
        --text: #1f2a2e;
        --muted: #5f6f73;
        --line: #e3e9e8;
        --warn: #b45309;
        --danger: #b91c1c;
        --bg: #f4f7f6;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.55;
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100vh;
        padding-bottom: env(safe-area-inset-bottom);
        user-select: none;
        -webkit-user-select: none;
      }
      .page {
        max-width: 640px;
        margin: 0 auto;
        background: #fff;
        min-height: 100vh;
        padding-bottom: 28px;
        position: relative;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 18px 14px;
        background: linear-gradient(135deg, var(--brand) 0%, #14876f 100%);
        color: #fff;
      }
      .brand img {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: #fff;
        object-fit: contain;
        padding: 4px;
        flex: 0 0 auto;
      }
      .brand h1 {
        margin: 0;
        font-size: 19px;
        line-height: 1.3;
        letter-spacing: 0.5px;
      }
      .brand p {
        margin: 2px 0 0;
        font-size: 12px;
        opacity: 0.86;
      }
      .sensitive {
        padding: 8px 18px;
        background: #fff4e5;
        color: #8a4b00;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        border-bottom: 1px solid #f2dcb8;
      }
      .sensitive::before {
        content: "!";
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #d97706;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }
      .insecure {
        padding: 8px 18px;
        background: #fdecec;
        color: #9b1c1c;
        font-size: 12px;
        border-bottom: 1px solid #f5c6c6;
      }
      .content {
        padding: 14px 16px 0;
      }
      .critical {
        margin: 0 0 14px;
        padding: 12px 14px;
        border: 1px solid #f0b4b4;
        background: #fff1f1;
        color: var(--danger);
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 14px;
        background: #fff;
      }
      .card h2 {
        margin: 0 0 10px;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .card h2 span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
      }
      .patient-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 12px;
        font-size: 14px;
      }
      .patient-grid label {
        color: var(--muted);
        font-size: 12px;
        display: block;
      }
      .metric {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
        padding: 11px 0;
        border-top: 1px solid var(--line);
        align-items: center;
        font-size: 14px;
      }
      .metric:first-of-type {
        border-top: 0;
      }
      .metric .name {
        font-weight: 500;
        word-break: break-word;
      }
      .metric .value {
        font-weight: 700;
        font-size: 16px;
        white-space: nowrap;
      }
      .metric .value em {
        font-style: normal;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        margin-left: 3px;
      }
      .metric .ref {
        color: var(--muted);
        font-size: 12px;
        text-align: right;
        white-space: nowrap;
      }
      .metric.abnormal .value {
        color: var(--warn);
      }
      .metric.abnormal .ref {
        color: var(--warn);
      }
      .metric.critical .value {
        color: var(--danger);
      }
      .metric.critical .ref {
        color: var(--danger);
      }
      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 11px;
        vertical-align: middle;
      }
      .badge.warn {
        background: #fdf0e3;
        color: var(--warn);
      }
      .badge.danger {
        background: #fdecec;
        color: var(--danger);
      }
      .arrow {
        margin-left: 2px;
        font-size: 13px;
      }
      .footer {
        padding: 4px 18px 24px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        line-height: 1.7;
      }
      .footer strong {
        color: var(--text);
      }
      .state {
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .state .icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--brand-soft);
        color: var(--brand);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        margin-bottom: 14px;
      }
      .state h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .state p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        max-width: 300px;
      }
      .watermark {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9;
        overflow: hidden;
        opacity: 0.07;
      }
      .watermark span {
        position: absolute;
        transform: rotate(-28deg);
        white-space: nowrap;
        font-size: 15px;
        color: #0b3d33;
      }
      @media (max-width: 380px) {
        .brand h1 {
          font-size: 17px;
        }
        .metric {
          grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr);
          font-size: 13px;
        }
        .metric .value {
          font-size: 15px;
        }
      }
      @media print {
        body {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="brand">
        <img src="logo.png" alt="医院标识" onerror="this.style.display='none'" />
        <div>
          <h1>固始中医肛肠医院</h1>
          <p>检验报告查询 · 患者本人查阅</p>
        </div>
      </header>
      <div class="sensitive">本页含敏感医疗信息，请勿截图或转发</div>
      <div id="insecure" class="insecure" hidden>当前为非加密连接，请勿在公共网络查看</div>
      <main id="content" class="content"></main>
      <footer class="footer">
        <div>检验结果仅供参考，请以医生解释为准。</div>
        <div>如需帮助，请联系检验科或您的接诊医生。</div>
      </footer>
    </div>
    <div id="watermark" class="watermark" aria-hidden="true"></div>

    <script>
      (function () {
        var content = document.getElementById("content");
        var watermark = document.getElementById("watermark");
        if (location.protocol !== "https:") document.getElementById("insecure").hidden = false;

        function escapeHtml(value) {
          return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
          });
        }

        function renderWatermark(text) {
          var block = text + "　";
          var html = "";
          for (var row = -2; row < 22; row++) {
            for (var col = -2; col < 6; col++) {
              html +=
                '<span style="top:' +
                row * 96 +
                "px;left:" +
                col * 260 +
                'px">' +
                escapeHtml(block) +
                "</span>";
            }
          }
          watermark.innerHTML = html;
        }

        function showState(icon, title, message) {
          content.innerHTML =
            '<div class="state"><div class="icon">' +
            icon +
            "</div><h2>" +
            escapeHtml(title) +
            "</h2><p>" +
            escapeHtml(message) +
            "</p></div>";
        }

        function parseRange(reference) {
          var match = String(reference || "").match(/(-?\d+(?:\.\d+)?)\s*[-~至]\s*(-?\d+(?:\.\d+)?)/);
          if (match) return { low: Number(match[1]), high: Number(match[2]) };
          return null;
        }

        function metricRow(metric) {
          var severity = metric.severity || "NORMAL";
          var critical = metric.critical === true || severity === "CRITICAL";
          var abnormal = !critical && (severity === "ABNORMAL" || severity === "LOW" || severity === "HIGH");
          var numeric = parseFloat(String(metric.value).replace(/[^\d.\-]/g, ""));
          var range = parseRange(metric.reference);
          var arrow = "";
          if (!critical && !abnormal && range && !isNaN(numeric)) {
            if (numeric < range.low) {
              abnormal = true;
              arrow = '<span class="arrow">↓</span>';
            } else if (numeric > range.high) {
              abnormal = true;
              arrow = '<span class="arrow">↑</span>';
            }
          }
          if (critical) arrow = "";
          var badge = critical
            ? '<span class="badge danger">危急值</span>'
            : abnormal
              ? '<span class="badge warn">异常</span>'
              : "";
          return (
            '<div class="metric ' +
            (critical ? "critical" : abnormal ? "abnormal" : "") +
            '">' +
            '<div class="name">' +
            escapeHtml(metric.name) +
            "</div>" +
            '<div class="value">' +
            escapeHtml(metric.value) +
            (metric.unit ? "<em>" + escapeHtml(metric.unit) + "</em>" : "") +
            arrow +
            badge +
            "</div>" +
            '<div class="ref">' +
            (metric.reference ? "参考 " + escapeHtml(metric.reference) : "") +
            "</div>" +
            "</div>"
          );
        }

        function render(data) {
          var patient = data.patient || {};
          var report = data.report || {};
          var metrics = Array.isArray(report.metrics) ? report.metrics : [];
          var criticalCount = Number(report.criticalCount || 0);
          var criticalHtml = criticalCount
            ? '<div class="critical">本报告存在 ' +
              criticalCount +
              " 项危急值，请尽快联系医生处理。</div>"
            : "";
          var patientHtml =
            '<section class="card"><h2>患者信息<span>' +
            escapeHtml(report.templateName || "") +
            "</span></h2>" +
            '<div class="patient-grid">' +
            "<div><label>姓名</label>" +
            escapeHtml(patient.name || "") +
            "</div>" +
            "<div><label>性别 / 年龄</label>" +
            escapeHtml((patient.gender || "—") + " / " + (patient.age || "—")) +
            "</div>" +
            "<div><label>门诊号</label>" +
            escapeHtml(patient.caseTokenMasked || "—") +
            "</div>" +
            "<div><label>报告日期</label>" +
            escapeHtml(report.reportDate || "—") +
            "</div>" +
            "</div></section>";
          var metricsHtml =
            '<section class="card"><h2>检验指标<span>共 ' +
            metrics.length +
            " 项</span></h2>" +
            (metrics.length ? metrics.map(metricRow).join("") : '<p style="color:#5f6f73">暂无指标</p>') +
            "</section>";
          content.innerHTML = criticalHtml + patientHtml + metricsHtml;
          renderWatermark(
            (patient.name || "患者") +
              " · " +
              (data.viewedAt || "").slice(5, 16) +
              " · 仅供本人查阅"
          );
        }

        var token = new URLSearchParams(location.search).get("token");
        if (!token) {
          showState("!", "链接不完整", "请重新扫描医院提供的二维码，或联系检验科。");
          return;
        }
        fetch("/lab-api/reports/" + encodeURIComponent(token), { headers: { Accept: "application/json" } })
          .then(function (response) {
            return response.text().then(function (text) {
              var payload = null;
              try {
                payload = JSON.parse(text);
              } catch (error) {
                payload = null;
              }
              return { status: response.status, payload: payload };
            });
          })
          .then(function (result) {
            if (result.status === 200 && result.payload && result.payload.data) {
              render(result.payload.data);
              return;
            }
            if (result.status === 410) {
              showState("⏱", "链接已失效", "该报告已撤销或超过 24 小时有效期，请重新扫码或联系医院。");
              return;
            }
            if (result.status === 429) {
              showState("!", "访问过于频繁", "请稍后再试，或联系检验科协助查询。");
              return;
            }
            showState("?", "未找到报告", "链接无效，请确认二维码来自本院，或联系检验科。");
          })
          .catch(function () {
            showState("!", "网络异常", "请检查网络后重试，或联系检验科。");
          });
      })();
    </script>
  </body>
</html>
