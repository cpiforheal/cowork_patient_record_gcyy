<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>检验报告查询</title>
    <style>
      :root {
        --brand: #0b6e5b;
        --brand-soft: #e7f3ef;
        --text: #1f2a2e;
        --muted: #5f6f73;
        --line: #e3e9e8;
        --warn: #b45309;
        --danger: #b91c1c;
        --bg: #f4f7f6;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%;
      }
      body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); user-select: none; -webkit-user-select: none; }
      .page { max-width: 640px; margin: 0 auto; background: #fff; min-height: 100vh; padding-bottom: 28px; position: relative; }
      .brand { display: flex; align-items: center; gap: 12px; padding: 18px 18px 14px; background: linear-gradient(135deg, var(--brand) 0%, #14876f 100%); color: #fff; }
      .brand img { width: 52px; height: 52px; border-radius: 12px; background: #fff; object-fit: contain; padding: 4px; flex: 0 0 auto; }
      .brand h1 { margin: 0; font-size: 19px; line-height: 1.3; letter-spacing: 0.5px; }
      .brand p { margin: 2px 0 0; font-size: 12px; opacity: 0.86; }
      .sensitive { padding: 8px 18px; background: #fff4e5; color: #8a4b00; font-size: 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #f2dcb8; }
      .sensitive::before { content: "!"; width: 16px; height: 16px; border-radius: 50%; background: #d97706; color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
      .insecure { padding: 8px 18px; background: #fdecec; color: #9b1c1c; font-size: 12px; border-bottom: 1px solid #f5c6c6; }
      .content { padding: 16px 16px 0; }
      .card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; background: #fff; }
      .card h2 { margin: 0 0 4px; font-size: 18px; }
      .card > p.hint { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
      .field { margin-bottom: 14px; }
      .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
      .field input {
        width: 100%; height: 48px; padding: 0 14px; font-size: 17px; color: var(--text);
        border: 1px solid var(--line); border-radius: 10px; background: #fff; outline: none;
      }
      .field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(11, 110, 91, 0.12); }
      .mode-switch { margin: -4px 0 16px; padding: 0; border: 0; background: none; color: var(--brand); font-size: 13px; text-decoration: underline; cursor: pointer; }
      .submit {
        width: 100%; height: 48px; border: 0; border-radius: 10px; background: var(--brand);
        color: #fff; font-size: 17px; font-weight: 600; cursor: pointer;
      }
      .submit:disabled { opacity: 0.6; cursor: default; }
      .form-error { min-height: 20px; margin: 10px 0 0; color: var(--danger); font-size: 13px; }
      .welcome { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
      .welcome strong { font-size: 18px; }
      .welcome button { border: 0; background: none; color: var(--brand); font-size: 13px; text-decoration: underline; cursor: pointer; }
      .critical { margin: 0 0 14px; padding: 12px 14px; border: 1px solid #f0b4b4; background: #fff1f1; color: var(--danger); border-radius: 12px; font-size: 14px; font-weight: 600; }
      .visit { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
      .visit-head {
        width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 14px 16px; border: 0; background: #fff; text-align: left; cursor: pointer;
      }
      .visit-head .date { font-size: 16px; font-weight: 600; }
      .visit-head .meta { color: var(--muted); font-size: 12px; }
      .visit-head .chevron { color: var(--muted); font-size: 14px; transition: transform 0.18s ease; }
      .visit.open .visit-head .chevron { transform: rotate(90deg); }
      .visit-body { display: none; padding: 0 12px 12px; }
      .visit.open .visit-body { display: block; }
      .report { border-top: 1px solid var(--line); }
      .report:first-child { border-top: 0; }
      .report-head {
        width: 100%; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
        padding: 13px 4px; border: 0; background: none; text-align: left; cursor: pointer;
      }
      .report-title { font-size: 15px; font-weight: 500; }
      .report-sub { margin-top: 2px; color: var(--muted); font-size: 12px; }
      .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; white-space: nowrap; }
      .badge.warn { background: #fdf0e3; color: var(--warn); }
      .badge.danger { background: #fdecec; color: var(--danger); }
      .badge.info { background: var(--brand-soft); color: var(--brand); }
      .report-body { display: none; padding: 2px 4px 12px; }
      .report.open .report-body { display: block; }
      .metric { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; font-size: 15px; }
      .metric .name { font-weight: 500; word-break: break-word; }
      .metric .value { font-weight: 700; font-size: 17px; white-space: nowrap; }
      .metric .value em { font-style: normal; font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
      .metric .ref { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
      .metric.abnormal .value, .metric.abnormal .ref { color: var(--warn); }
      .metric.critical .value, .metric.critical .ref { color: var(--danger); }
      .arrow { margin-left: 2px; font-size: 13px; }
      .empty-state { padding: 42px 20px; text-align: center; color: var(--muted); }
      .empty-state strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 17px; }
      .footer { padding: 8px 18px 24px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.7; }
      .watermark { position: fixed; inset: 0; pointer-events: none; z-index: 9; overflow: hidden; opacity: 0.07; }
      .watermark span { position: absolute; transform: rotate(-28deg); white-space: nowrap; font-size: 15px; color: #0b3d33; }
      @media (max-width: 380px) {
        .brand h1 { font-size: 17px; }
        .metric { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); font-size: 14px; }
        .metric .value { font-size: 16px; }
      }
      @media print { body { display: none !important; } }
    </style>
  </head>

    <script>
      (function () {
        var app = document.getElementById("app");
        var watermark = document.getElementById("watermark");
        if (location.protocol !== "https:") document.getElementById("insecure").hidden = false;

        function esc(value) {
          return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
          });
        }

        function api(path, options) {
          return fetch(path, Object.assign({ headers: { Accept: "application/json" } }, options || {}))
            .then(function (response) {
              return response.text().then(function (text) {
                var payload = null;
                try { payload = JSON.parse(text); } catch (error) { payload = null; }
                return { status: response.status, payload: payload };
              });
            });
        }

        function messageOf(result, fallback) {
          return (result.payload && result.payload.msg) || fallback;
        }

        function renderWatermark(name) {
          var stamp = new Date();
          var pad = function (n) { return String(n).padStart(2, "0"); };
          var time = (stamp.getMonth() + 1) + "-" + pad(stamp.getDate()) + " " + pad(stamp.getHours()) + ":" + pad(stamp.getMinutes());

          for (var row = -2; row < 26; row++) {
            for (var col = -2; col < 6; col++) {
              html += '<span style="top:' + row * 96 + "px;left:" + col * 280 + 'px">' + esc(text) + "</span>";
            }
          }
          watermark.innerHTML = html;
        }

        function clearWatermark() { watermark.innerHTML = ""; }

          var submit = document.getElementById("submit");

              digits.maxLength = 4;
              digits.placeholder = "请输入手机号后四位";
              toggle.textContent = "改用证件号后六位查询";
            } else {
              mode = "ID";
              label.textContent = "证件号后六位";
              digits.maxLength = 6;
              digits.placeholder = "请输入证件号后六位";
              toggle.textContent = "没有登记身份证？用手机号后四位";
            }
            digits.value = "";
            error.textContent = "";
          });
          form.addEventListener("submit", function (event) {
            event.preventDefault();
            var name = document.getElementById("name").value.trim();
            var value = digits.value.trim();
            if (!name) { error.textContent = "请填写姓名"; return; }
            if (!value) { error.textContent = mode === "ID" ? "请填写证件号后六位" : "请填写手机号后四位"; return; }
            submit.disabled = true;
            submit.textContent = "查询中…";
            error.textContent = "";
            api("/lab-api/lookup", {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({ name: name, mode: mode, lastDigits: value })
            }).then(function (result) {
              if (result.status === 200 && result.payload && result.payload.data) {
                renderList(result.payload.data);
                return;
              }
              error.textContent = messageOf(result, "查询失败，请稍后再试");
              submit.disabled = false;
              submit.textContent = "查询报告";
            }).catch(function () {
              error.textContent = "网络异常，请检查网络后重试";
              submit.disabled = false;
              submit.textContent = "查询报告";
            });
          });
        }

        function renderList(data) {
          var name = (data.patient && data.patient.name) || "";
          var groups = data.groups || [];
          if (!groups.length) {
            renderEmpty(name);
            return;
          }
          renderWatermark(name);
          var criticalTotal = 0;
          groups.forEach(function (group) {
            (group.reports || []).forEach(function (report) { criticalTotal += Number(report.criticalCount || 0); });
          });
          var html = '<div class="welcome"><span>您好，<strong>' + esc(name) + "</strong></span>" +
            '<button id="logout" type="button">切换查询</button></div>';
          if (criticalTotal > 0) {
            html += '<div class="critical">您有 ' + criticalTotal + " 项危急值结果，请尽快联系医生。</div>";
          }
          html += '<div id="visits"></div>';
          app.innerHTML = html;
          var visits = document.getElementById("visits");
          groups.forEach(function (group, groupIndex) {
            var visit = document.createElement("section");
            visit.className = "visit";
            var reportCount = (group.reports || []).length;
            visit.innerHTML =
              '<button class="visit-head" type="button">' +
                '<span><span class="date">' + esc(group.visitDate) + " 就诊</span>" +
                '<div class="meta">' + reportCount + ' 份报告</div></span>' +
                '<span class="chevron">›</span>' +
              "</button>" +
              '<div class="visit-body"></div>';
            var head = visit.querySelector(".visit-head");
            var body = visit.querySelector(".visit-body");
            head.addEventListener("click", function () {
              visit.classList.toggle("open");
              if (visit.classList.contains("open") && !body.dataset.rendered) {
                body.dataset.rendered = "1";
                (group.reports || []).forEach(function (report) { body.appendChild(reportCard(report)); });
              }
            });
            visits.appendChild(visit);
          });
          document.getElementById("logout").addEventListener("click", logout);
        }

        function reportCard(report) {
          var card = document.createElement("article");
          card.className = "report";
          var critical = Number(report.criticalCount || 0);
          var abnormal = Number(report.abnormalCount || 0);
          var badges = "";
          if (critical > 0) badges += '<span class="badge danger">危急 ' + critical + "</span>";
          if (abnormal > 0) badges += '<span class="badge warn">异常 ' + abnormal + "</span>";
          if (!badges) badges = '<span class="badge info">未见异常</span>';
          card.innerHTML =
            '<button class="report-head" type="button">' +
              '<span><div class="report-title">' + esc(report.templateName || "检验报告") + "</div>" +
              '<div class="report-sub">' + esc(report.reportDate || "") + "</div></span>" +
              '<span class="badges">' + badges + "</span>" +
            "</button>" +
            '<div class="report-body"></div>';
          var head = card.querySelector(".report-head");
          var body = card.querySelector(".report-body");
          head.addEventListener("click", function () {
            card.classList.toggle("open");
            if (!card.classList.contains("open") || body.dataset.loaded) return;
            body.dataset.loaded = "1";
            body.innerHTML = '<p style="color:#5f6f73;font-size:13px">加载中…</p>';
            api("/lab-api/reports/" + encodeURIComponent(report.reportId)).then(function (result) {
              if (result.status === 200 && result.payload && result.payload.data) {
                body.innerHTML = (result.payload.data.metrics || []).map(metricRow).join("") ||
                  '<p style="color:#5f6f73;font-size:13px">暂无指标</p>';
                return;
              }
              body.dataset.loaded = "";
              body.innerHTML = '<p style="color:#b91c1c;font-size:13px">' + esc(messageOf(result, "报告加载失败")) + "</p>";
            }).catch(function () {
              body.dataset.loaded = "";
              body.innerHTML = '<p style="color:#b91c1c;font-size:13px">网络异常，请稍后重试</p>';
            });
          });
          return card;
        }

        function parseRange(reference) {
          var match = String(reference || "").match(/(-?\d+(?:\.\d+)?)\s*[-~至]\s*(-?\d+(?:\.\d+)?)/);
          return match ? { low: Number(match[1]), high: Number(match[2]) } : null;
        }

        function metricRow(metric) {
          var severity = metric.severity || "NORMAL";
          var critical = metric.critical === true || severity === "CRITICAL";
          var abnormal = !critical && severity === "ABNORMAL";
          var numeric = parseFloat(String(metric.value).replace(/[^\d.\-]/g, ""));
          var range = parseRange(metric.reference);
          var arrow = "";
          if (!critical && !abnormal && range && !isNaN(numeric)) {
            if (numeric < range.low) { abnormal = true; arrow = '<span class="arrow">↓</span>'; }
            else if (numeric > range.high) { abnormal = true; arrow = '<span class="arrow">↑</span>'; }
          }
          return (
            '<div class="metric ' + (critical ? "critical" : abnormal ? "abnormal" : "") + '">' +
              '<div class="name">' + esc(metric.name) + "</div>" +
              '<div class="value">' + esc(metric.value) +
                (metric.unit ? "<em>" + esc(metric.unit) + "</em>" : "") + arrow +
                (critical ? '<span class="badge danger" style="margin-left:6px">危急值</span>' : "") +
              "</div>" +
              '<div class="ref">' + (metric.reference ? "参考 " + esc(metric.reference) : "") + "</div>" +
            "</div>"
          );
        }

        function renderEmpty(name) {
          renderWatermark(name);
          app.innerHTML =
            '<div class="welcome"><span>您好，<strong>' + esc(name) + "</strong></span>" +
            '<button id="logout" type="button">切换查询</button></div>' +
            '<section class="card empty-state"><strong>暂无可查看报告</strong>' +
            "<div>报告完成后会自动同步，请以医院通知为准。</div></section>";
          document.getElementById("logout").addEventListener("click", logout);
        }

        function logout() {
          api("/lab-api/logout", { method: "POST" }).then(function () { renderLogin(""); });
        }

        api("/lab-api/reports").then(function (result) {
          if (result.status === 200 && result.payload && result.payload.data) {
            renderList(result.payload.data);
            return;
          }
          renderLogin("");
        }).catch(function () { renderLogin(""); });
      })();
    </script>
  </body>
</html>
